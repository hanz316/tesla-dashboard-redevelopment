name: host-tests

on:
  push:
    branches:
      - feature/v6-cockpit
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_HOST_TOOLS=ON -DBUILD_FLYTHINGS_DEVICE=OFF
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
